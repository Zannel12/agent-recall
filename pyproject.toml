[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-recall"
version = "0.1.0"
description = "Cited, scoped retrieval from local Markdown vaults for AI agents."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
agent-recall = "agent_recall.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
