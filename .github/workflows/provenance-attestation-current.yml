name: One-shot current 0.2.0 provenance attestation

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build exact current subjects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 70e358022e507279939b4cc9435d185e84474433
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build exact unpublished subjects
        run: python tools/build_release_candidate.py --output "$RUNNER_TEMP/current-candidate"
      - name: Validate exact subject manifest
        run: |
          python - "$RUNNER_TEMP/current-candidate" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / "release-candidate-manifest.json").read_text(encoding="utf-8"))
          expected = {
              "cited_vault_recall-0.2.0-py3-none-any.whl",
              "cited_vault_recall-0.2.0.tar.gz",
          }
          records = manifest.get("artifacts")
          if manifest.get("package") != "cited-vault-recall" or manifest.get("version") != "0.2.0" or manifest.get("unpublished") is not True or {item.get("filename") for item in records or []} != expected:
              raise SystemExit("unexpected current artifact manifest")
          for item in records:
              path = root / "artifacts" / item["filename"]
              if not path.is_file() or path.stat().st_size != item["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit("current artifact checksum validation failed")
          PY
      - name: Transfer exact unprivileged subjects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-provenance-subjects-70e358022e507279939b4cc9435d185e84474433
          path: |
            ${{ runner.temp }}/current-candidate/artifacts/cited_vault_recall-0.2.0-py3-none-any.whl
            ${{ runner.temp }}/current-candidate/artifacts/cited_vault_recall-0.2.0.tar.gz
            ${{ runner.temp }}/current-candidate/release-candidate-manifest.json
            ${{ runner.temp }}/current-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest exact current subjects
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download exact subjects without repository checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-provenance-subjects-70e358022e507279939b4cc9435d185e84474433
          path: verified-candidate
      - name: Verify transferred checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("verified-candidate")
          manifest = json.loads((root / "release-candidate-manifest.json").read_text(encoding="utf-8"))
          expected = {
              "cited_vault_recall-0.2.0-py3-none-any.whl",
              "cited_vault_recall-0.2.0.tar.gz",
          }
          records = manifest.get("artifacts")
          if manifest.get("package") != "cited-vault-recall" or manifest.get("version") != "0.2.0" or manifest.get("unpublished") is not True or {item.get("filename") for item in records or []} != expected:
              raise SystemExit("unexpected transferred artifact manifest")
          lines = []
          for item in sorted(records, key=lambda record: record["filename"]):
              path = root / "artifacts" / item["filename"]
              if not path.is_file() or path.stat().st_size != item["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit("transferred artifact checksum validation failed")
              lines.append(f"{item['sha256']}  verified-candidate/artifacts/{item['filename']}\n")
          if (root / "SHA256SUMS").read_text(encoding="utf-8") != "".join(
              f"{item['sha256']}  artifacts/{item['filename']}\n" for item in sorted(records, key=lambda record: record["filename"])
          ):
              raise SystemExit("transferred checksum manifest changed")
          Path("CURRENT-ATTESTATION-SHA256SUMS").write_text("".join(lines), encoding="utf-8")
          PY
      - name: Generate GitHub build provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: CURRENT-ATTESTATION-SHA256SUMS
          show-summary: true
      - name: Record attestation reference
        run: |
          printf '%s\n' 'attestation_id=${{ steps.attest.outputs.attestation-id }}'
          printf '%s\n' 'attestation_url=${{ steps.attest.outputs.attestation-url }}'
