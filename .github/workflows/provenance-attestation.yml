name: One-shot C6b provenance attestation

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build exact C6b subjects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 037f90437a05ae93a700d321d584b85abbb9e569
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build exact unpublished subjects
        run: python tools/build_release_candidate.py --output "$RUNNER_TEMP/c6b-candidate"
      - name: Validate exact subject manifest
        run: |
          python - "$RUNNER_TEMP/c6b-candidate" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          manifest = json.loads((root / "release-candidate-manifest.json").read_text(encoding="utf-8"))
          expected = {
              "cited_vault_recall-0.2.0.dev0-py3-none-any.whl",
              "cited_vault_recall-0.2.0.dev0.tar.gz",
          }
          records = manifest.get("artifacts")
          if manifest.get("unpublished") is not True or {item.get("filename") for item in records or []} != expected:
              raise SystemExit("unexpected C6b artifact manifest")
          for item in records:
              path = root / "artifacts" / item["filename"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if not path.is_file() or path.stat().st_size != item["bytes"] or digest != item["sha256"]:
                  raise SystemExit("C6b artifact checksum validation failed")
          PY
      - name: Transfer exact unprivileged subjects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c6b-provenance-subjects-037f90437a05ae93a700d321d584b85abbb9e569
          path: |
            ${{ runner.temp }}/c6b-candidate/artifacts/cited_vault_recall-0.2.0.dev0-py3-none-any.whl
            ${{ runner.temp }}/c6b-candidate/artifacts/cited_vault_recall-0.2.0.dev0.tar.gz
            ${{ runner.temp }}/c6b-candidate/release-candidate-manifest.json
            ${{ runner.temp }}/c6b-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest exact C6b subjects
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download exact subjects without repository checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: c6b-provenance-subjects-037f90437a05ae93a700d321d584b85abbb9e569
          path: verified-candidate
      - name: Verify transferred checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("verified-candidate")
          manifest = json.loads((root / "release-candidate-manifest.json").read_text(encoding="utf-8"))
          expected = {
              "cited_vault_recall-0.2.0.dev0-py3-none-any.whl",
              "cited_vault_recall-0.2.0.dev0.tar.gz",
          }
          records = manifest.get("artifacts")
          if manifest.get("unpublished") is not True or {item.get("filename") for item in records or []} != expected:
              raise SystemExit("unexpected transferred C6b artifact manifest")
          expected_sums = []
          for item in sorted(records, key=lambda record: record["filename"]):
              path = root / "artifacts" / item["filename"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if not path.is_file() or path.stat().st_size != item["bytes"] or digest != item["sha256"]:
                  raise SystemExit("transferred C6b artifact checksum validation failed")
              expected_sums.append(f"{digest}  verified-candidate/artifacts/{item['filename']}\n")
          if (root / "SHA256SUMS").read_text(encoding="utf-8") != "".join(
              f"{item['sha256']}  artifacts/{item['filename']}\n" for item in sorted(records, key=lambda record: record["filename"])
          ):
              raise SystemExit("transferred C6b checksum manifest changed")
          Path("C6B-ATTESTATION-SHA256SUMS").write_text("".join(expected_sums), encoding="utf-8")
          PY
      - name: Generate GitHub build provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: C6B-ATTESTATION-SHA256SUMS
          show-summary: true
      - name: Record attestation reference
        run: |
          printf '%s\n' 'attestation_id=${{ steps.attest.outputs.attestation-id }}'
          printf '%s\n' 'attestation_url=${{ steps.attest.outputs.attestation-url }}'
