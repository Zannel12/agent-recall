name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build backend and package
        run: |
          python -m pip install "setuptools>=68"
          python -m pip install --no-deps .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Verify installed CLI demo
        run: agent-recall examples/demo-vault "privacy" --format json

  smoke:
    name: Clean installation smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install "setuptools>=68"
      - name: Run clean-install smoke
        run: python -m unittest tests.test_clean_install_e2e_smoke -v
